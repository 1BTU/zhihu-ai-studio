<path d="M1370 402 V450 H230 V505" fill="none" stroke="#315b49" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="441" text-anchor="middle" font-size="17" fill="#6f7f70">初稿完成后进入独立审稿；需要修改时返回初稿并重新审阅</text>
<rect x="140" y="765" width="1320" height="155" rx="20" fill="#e9efe3" stroke="#c8d7c3" stroke-width="2"/><text x="800" y="814" text-anchor="middle" font-size="29" font-weight="600">LLM Wiki 写作参考库</text><text x="800" y="856" text-anchor="middle" font-size="21">来源与互动证据　→　文章拆解卡　→　写法与适用边界　→　写作计划</text><text x="800" y="892" text-anchor="middle" font-size="17" fill="#6b7d6a">写作前检索；复盘后可补充笔记与偏好。当前不自动根据互动数据重写规则。</text><text x="800" y="967" text-anchor="middle" font-size="19" fill="#647c66">学习写法，保留来源；图文校验通过后再发布。</text></g></svg>