<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">从热点到作品：知乎 AI 写作工作台流程</title><desc id="desc">获取热点，核实选题，检索 LLM Wiki，生成初稿，独立审稿，图文草稿校验，提交知乎，数据与复盘。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#315b49" stroke-width="1.6"/></marker></defs><rect width="1600" height="1000" rx="24" fill="#f8f7f0"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" fill="#264f3f"><text x="800" y="91" text-anchor="middle" font-size="48" font-weight="700">从热点到作品</text><text x="800" y="137" text-anchor="middle" font-size="21" fill="#6d7c70">知乎 AI 写作工作台 · 多模型 · LLM Wiki · 审稿与发布</text>
<rect x="60" y="210" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="102" cy="253" r="22" fill="#e2b974"/><text x="102" y="261" font-size="23" font-weight="600" text-anchor="middle">1</text><text x="138" y="263" font-size="27" font-weight="600">获取热点</text><path d="M88 294 H372" stroke="#dce4d9"/><text x="88" y="332" font-size="18">每日采集 / 用户想法</text><text x="88" y="368" font-size="18" fill="#748174">保留来源与事件时间</text>
<rect x="440" y="210" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="482" cy="253" r="22" fill="#e2b974"/><text x="482" y="261" font-size="23" font-weight="600" text-anchor="middle">2</text><text x="518" y="263" font-size="27" font-weight="600">核实与选题</text><path d="M468 294 H752" stroke="#dce4d9"/><text x="468" y="332" font-size="18">判断证据、读者关联和新意</text><text x="468" y="368" font-size="18" fill="#748174">排除过期与重复选题</text>
<rect x="820" y="210" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="862" cy="253" r="22" fill="#e2b974"/><text x="862" y="261" font-size="23" font-weight="600" text-anchor="middle">3</text><text x="898" y="263" font-size="27" font-weight="600">检索写作参考</text><path d="M848 294 H1132" stroke="#dce4d9"/><text x="848" y="332" font-size="18">LLM Wiki 合格卡片与写法页</text><text x="848" y="368" font-size="18" fill="#748174">记录借鉴方法和使用边界</text>
<rect x="1200" y="210" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="1242" cy="253" r="22" fill="#e2b974"/><text x="1242" y="261" font-size="23" font-weight="600" text-anchor="middle">4</text><text x="1278" y="263" font-size="27" font-weight="600">生成初稿</text><path d="M1228 294 H1512" stroke="#dce4d9"/><text x="1228" y="332" font-size="18">写作计划、短文或分节长文</text><text x="1228" y="368" font-size="18" fill="#748174">保留人物设定与已有正文</text>
<rect x="60" y="510" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="102" cy="553" r="22" fill="#e2b974"/><text x="102" y="561" font-size="23" font-weight="600" text-anchor="middle">5</text><text x="138" y="563" font-size="27" font-weight="600">独立审稿</text><path d="M88 594 H372" stroke="#dce4d9"/><text x="88" y="632" font-size="18">事实、逻辑、原创与连贯性</text><text x="88" y="668" font-size="18" fill="#748174">修改后重审，通过后绑定指纹</text>
<rect x="440" y="510" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="482" cy="553" r="22" fill="#e2b974"/><text x="482" y="561" font-size="23" font-weight="600" text-anchor="middle">6</text><text x="518" y="563" font-size="27" font-weight="600">图文草稿校验</text><path d="M468 594 H752" stroke="#dce4d9"/><text x="468" y="632" font-size="18">正文输入、配图上传与转存</text><text x="468" y="668" font-size="18" fill="#748174">刷新核对全文、数量与位置</text>
<rect x="820" y="510" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="862" cy="553" r="22" fill="#e2b974"/><text x="862" y="561" font-size="23" font-weight="600" text-anchor="middle">7</text><text x="898" y="563" font-size="27" font-weight="600">提交知乎</text><path d="M848 594 H1132" stroke="#dce4d9"/><text x="848" y="632" font-size="18">按指令或配置提交发布</text><text x="848" y="668" font-size="18" fill="#748174">核实结果，记录平台审核状态</text>
<rect x="1200" y="510" width="340" height="192" rx="18" fill="#fffef9" stroke="#cfdace" stroke-width="2"/><circle cx="1242" cy="553" r="22" fill="#e2b974"/><text x="1242" y="561" font-size="23" font-weight="600" text-anchor="middle">8</text><text x="1278" y="563" font-size="27" font-weight="600">数据与复盘</text><path d="M1228 594 H1512" stroke="#dce4d9"/><text x="1228" y="632" font-size="18">阅读、赞同、评论与收藏采样</text><text x="1228" y="668" font-size="18" fill="#748174">沉淀真实反馈，辅助后续写作</text>
