<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2"><title>写作参考库 · LLM Wiki</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="sidebar"><a class="brand" href="#"><span class="mark">文</span>写作参考库</a><p class="label">PERSONAL WRITING WIKI</p><nav aria-label="知识库导航"><button data-view="approved" class="nav active">可用范文 <span id="approvedCount">—</span></button><button data-view="candidates" class="nav">候选文章 <span id="candidateCount">—</span></button><button data-view="methods" class="nav">写作方法 <span>↗</span></button></nav><div class="sidebar-note"><span class="live-dot"></span> 先看反馈，再看写法<p>保留来源，拆解结构。<br>每一次写作，都有迹可循。</p></div><footer><a href="/studio/overview/">知乎运营工作台 ↗</a><span>个人知识库</span></footer></aside>
<main><header><div><p class="eyebrow">一份持续积累的写作笔记</p><h1 id="heading">值得反复读的文章</h1><p class="intro" id="intro">从读者反馈里筛选，再看一篇文章如何提出问题、推进判断。</p></div><div class="workspace-actions"><a class="workspace-back" href="/studio/overview/">← 返回运营工作台</a><a class="feedback-link" href="/studio/feedback/">反馈问题 / 建议</a></div></header>
<section class="stats" aria-label="知识库概况"><div><strong id="total">—</strong><span>收录线索</span></div><div><strong id="eligible">—</strong><span>通过筛选</span></div><div><strong id="platformTotal">—</strong><span>来源平台</span></div><p>学的是写法，<br><b>留下的是自己的判断。</b></p></section>
<div class="toolbar"><label class="search"><span class="search-icon" aria-hidden="true"></span><input type="search" id="search" placeholder="搜索文章、主题或写法…" aria-label="搜索知识库"><kbd>/</kbd></label><label class="filter-label">平台<select id="platform" aria-label="按平台筛选"><option value="">全部平台</option></select></label><button class="refresh" id="refresh" aria-label="重新读取页面数据">↻ 刷新</button></div>
<div class="section-title"><h2 id="sectionHeading">可用范文</h2><span id="resultCount" role="status"></span></div><div id="notice" class="notice" hidden></div><section id="cards" class="cards" aria-label="文章列表"></section><p class="empty" id="empty" hidden>没有找到符合条件的内容。试试更短的关键词，或切换平台。</p><div class="bottom"><p id="updated">正在读取知识库…</p><p>指标保留平台原名 · 不跨平台混排热度</p></div></main>
<dialog id="detail"><div class="dialog-bar"><span>阅读笔记</span><button id="close" aria-label="关闭阅读笔记">✕</button></div><article id="article"></article></dialog><script src="app.js" defer></script></body></html>
